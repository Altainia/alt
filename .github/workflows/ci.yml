name: CI

on:
  # Pull requests carry branch CI, including for forks: 'synchronize' is a default
  # type, so a fork PR is tested when opened and on every push after. 'push' is
  # restricted to main because it does not fire in this repository for fork
  # pushes, and because a branch with an open PR would otherwise fire both events
  # and have one run cancel the other on the same SHA -- cancelled jobs display
  # as failed. A branch with no PR open yet runs on demand:
  # 'gh workflow run CI --ref <branch>'.
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Keyed on the PR number rather than the head branch name, because head_ref for
# a fork PR is the fork's own branch name and is not namespaced by owner: two
# contributors who both push a branch called 'patch-1' would otherwise share one
# group and cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-gcc:
    name: Build & Test (GCC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install liburing
        run: sudo apt-get update && sudo apt-get install -y liburing-dev
      - name: Configure
        run: cmake --preset debug -DALT_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build --preset debug
      - name: Test
        run: ctest --preset debug

  build-clang:
    name: Build & Test (Clang)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Clang
        run: sudo apt-get update && sudo apt-get install -y clang-19 liburing-dev
      - name: Configure
        run: >
          cmake --preset debug
          -DCMAKE_C_COMPILER=clang-19
          -DCMAKE_CXX_COMPILER=clang++-19
          -DALT_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build --preset debug
      - name: Test
        run: ctest --preset debug

  asan:
    name: AddressSanitizer + UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install liburing
        run: sudo apt-get update && sudo apt-get install -y liburing-dev
      - name: Configure
        run: cmake --preset debug-asan -DALT_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build --preset debug-asan
      - name: Test
        run: ctest --preset debug-asan

  # MSan (MemorySanitizer) is intentionally excluded from CI. MSan requires a
  # fully MSan-instrumented C++ standard library (libc++) to avoid false
  # positives and deadlocks in the error reporter. The debug-msan preset is
  # provided for local use by developers who have a properly instrumented
  # libc++ toolchain. See: https://clang.llvm.org/docs/MemorySanitizer.html

  tsan:
    name: ThreadSanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install liburing
        run: sudo apt-get update && sudo apt-get install -y liburing-dev
      - name: Configure
        run: cmake --preset debug-tsan -DALT_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build --preset debug-tsan
      - name: Test
        run: ctest --preset debug-tsan

  release-tests:
    name: Build & Test (optimized)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install liburing
        run: sudo apt-get update && sudo apt-get install -y liburing-dev
      - name: Configure
        run: cmake --preset release-tests -DALT_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build --preset release-tests
      - name: Test
        run: ctest --preset release-tests

  # One job per preset rather than one preset per job, because each found something
  # the others did not when MSVC support was added: debug the use-after-free in
  # detail::stop_forwarder that MSVC's stop_token exposes as a hang, release-tests the
  # optimizer-only C4702, and debug-asan MSVC's std::optional poisoning. CMake's
  # default generator on Windows is the newest Visual Studio, which needs no
  # Developer Command Prompt, so the presets run unchanged.
  msvc:
    name: Build & Test (MSVC, ${{ matrix.preset }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, release-tests, debug-asan]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DALT_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel
      # Diagnostic for issue #68: test discovery once overran gtest_discover_tests' 5s
      # limit on this runner, where the same listing takes ~0.3-0.6s locally, and the
      # cause was never measured. Two launches, back to back, so a one-off first-launch
      # cost (such as a scan of the freshly built executable) shows as a gap between
      # them. Running here warms the executable before ctest's own discovery, so this
      # step may hide the original failure; it records every run's numbers instead of
      # only the rare failing one. It never fails the job, and its own timeout keeps a
      # hang from holding the runner.
      - name: Time test discovery (issue #68)
        timeout-minutes: 5
        continue-on-error: true
        run: |
          $exe = Get-ChildItem "build/${{ matrix.preset }}/tests" -Recurse -Filter alt_tests.exe | Select-Object -First 1
          if (-not $exe) { Write-Output "alt_tests.exe not found under build/${{ matrix.preset }}/tests"; exit 0 }
          $size = [math]::Round($exe.Length / 1MB, 1)
          $age = [math]::Round(((Get-Date) - $exe.LastWriteTime).TotalSeconds, 1)
          $rows = foreach ($launch in 1, 2) {
              $watch = [System.Diagnostics.Stopwatch]::StartNew()
              $listing = & $exe.FullName --gtest_list_tests 2>&1
              $code = $LASTEXITCODE
              $watch.Stop()
              $count = @($listing | Where-Object { $_ -match '^  \S' }).Count
              "| ${{ matrix.preset }} | $launch | $([math]::Round($watch.Elapsed.TotalSeconds, 3)) | $code | $count |"
          }
          $report = @(
              "### Test discovery timing (issue #68)",
              "",
              "alt_tests.exe: $size MB, written ${age}s before the first launch",
              "",
              "| preset | launch | seconds | exit | tests listed |",
              "|---|---|---|---|---|"
          ) + $rows
          $report | Write-Output
          $report | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Clang and clang-tidy
        run: sudo apt-get update && sudo apt-get install -y clang-19 clang-tidy-19 liburing-dev
      - name: Configure
        run: >
          cmake -B build/tidy
          -DCMAKE_C_COMPILER=clang-19
          -DCMAKE_CXX_COMPILER=clang++-19
          -DCLANG_TIDY_PATH=/usr/bin/clang-tidy-19
          -DCMAKE_BUILD_TYPE=Debug
          -DALT_CLANG_TIDY=ON
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Build (runs clang-tidy on every source)
        run: cmake --build build/tidy

  cppcheck:
    name: cppcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck liburing-dev
      - name: Configure
        run: cmake --preset debug -DALT_CPPCHECK=ON
      - name: Run cppcheck
        run: cmake --build --preset debug --target cppcheck

  clang-format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        # Pinned on purpose, for the same reason clang-tidy is. clang-format's output
        # changes between releases, so an unpinned formatter would make this gate flap
        # whenever the runner image moves -- and a format gate that fails spuriously is
        # one somebody switches off, which is how the drift this job exists to stop got
        # in. ubuntu-latest does not package this release; the PyPI wheel carries the
        # exact LLVM build and needs no extra apt repository. Keep the version here and
        # the one named in CLAUDE.md's clang-format section in step.
        run: |
          python3 -m venv /tmp/clang-format-venv
          /tmp/clang-format-venv/bin/pip install --quiet clang-format==21.1.8
      - name: Check formatting
        # --Werror turns a needed edit into a failure; without it clang-format reports
        # the diff and exits 0, which would make this job incapable of failing.
        run: git ls-files -z '*.cpp' '*.hpp' | xargs -0 /tmp/clang-format-venv/bin/clang-format --dry-run --Werror

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install lcov
        run: sudo apt-get update && sudo apt-get install -y lcov liburing-dev
      - name: Configure
        run: cmake --preset debug-coverage
      - name: Build
        run: cmake --build --preset debug-coverage
      - name: Generate coverage report
        run: cmake --build --preset debug-coverage --target coverage
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/debug-coverage/coverage/
